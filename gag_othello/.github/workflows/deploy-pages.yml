# main ブランチに push すると、Flutter をウェブ用にビルドして GitHub Pages に公開する。
# 使うには、リポジトリの Settings → Pages → Source を「GitHub Actions」にする（DEPLOY.md 参照）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 手元で動いている版に合わせたいときは、次の行のコメントを外して版を入れる（flutter --version で確認）
          # flutter-version: 3.41.5
          cache: true

      # 公開先のフォルダ名（https://ユーザー名.github.io/リポジトリ名/）に合わせる。
      # リポジトリ名が「ユーザー名.github.io」のときだけ、ルート（/）で公開される。
      - name: Decide base href
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) echo "href=/" >> "$GITHUB_OUTPUT" ;;
            *) echo "href=/${REPO}/" >> "$GITHUB_OUTPUT" ;;
          esac

      # タブ名・説明・読み込み中の画面を整える（設定済みなら何もしない）
      - run: python3 tool/post_create.py

      - run: flutter pub get
      - run: flutter build web --release --base-href "${{ steps.base.outputs.href }}"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v5
